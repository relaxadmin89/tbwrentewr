<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xgurusx | Full Stack Developer &amp; Designer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Gracefully suppress benign Vite HMR websocket connection errors in preview -->
    <style>
      /* Hide Vite HMR error overlay completely on any screen */
      vite-error-overlay, 
      #vite-error-overlay-root, 
      [id^="vite-error-overlay"], 
      div[style*="z-index: 99999"] {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
        visibility: hidden !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
    <script>
      (function() {
        // Suppress console errors and warnings about Vite WebSocket connections
        const originalWarn = console.warn;
        const originalError = console.error;
        console.warn = function(...args) {
          const msg = args.join(' ');
          if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('hmr') || msg.includes('connection failed')) {
            return; // Ignore Vite HMR warnings
          }
          originalWarn.apply(console, args);
        };
        console.error = function(...args) {
          const msg = args.join(' ');
          if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('hmr') || msg.includes('connection failed') || msg.includes('WebSocket closed')) {
            return; // Ignore Vite HMR errors
          }
          originalError.apply(console, args);
        };

        // Intercept WebSocket creation to gracefully suppress benign Vite HMR websocket connection failures
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHmr = typeof url === 'string' && (
              url.includes('vite') || 
              url.includes('hmr') || 
              url.includes('3000') || 
              url.includes('run.app') || 
              url.includes('websocket')
            );
            if (isViteHmr) {
              console.info('Vite HMR WebSocket connection quieted:', url);
              
              // Return a standard EventTarget so standard event registration works perfectly
              const mockWS = new EventTarget();
              mockWS.url = url;
              mockWS.readyState = 3; // CLOSED
              mockWS.bufferedAmount = 0;
              mockWS.extensions = '';
              mockWS.protocol = '';
              mockWS.binaryType = 'blob';
              mockWS.send = function() {};
              mockWS.close = function() {};
              
              // Add dummy properties that won't trigger uncaught exceptions
              let _onopen = null;
              let _onmessage = null;
              let _onerror = null;
              let _onclose = null;
              
              Object.defineProperties(mockWS, {
                onopen: { get() { return _onopen; }, set(val) { _onopen = val; } },
                onmessage: { get() { return _onmessage; }, set(val) { _onmessage = val; } },
                onerror: { get() { return _onerror; }, set(val) { _onerror = val; } },
                onclose: { 
                  get() { return _onclose; }, 
                  set(val) { 
                    _onclose = val; 
                    if (typeof val === 'function') {
                      setTimeout(() => {
                        try {
                          val({ wasClean: true, code: 1000, reason: "Quiet fallback" });
                        } catch(e) {}
                      }, 50);
                    }
                  } 
                },
              });

              return mockWS;
            }
            return new OriginalWebSocket(url, protocols);
          };
          
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }

        // Catch and prevent any residual unhandled WebSocket rejections or error overlays from Vite
        window.addEventListener('unhandledrejection', function(event) {
          const reasonStr = String(event.reason || '');
          const reasonMsg = String(event.reason?.message || '');
          if (
            reasonStr.includes('WebSocket') || 
            reasonMsg.includes('WebSocket') ||
            reasonStr.includes('vite') ||
            reasonMsg.includes('vite') ||
            reasonStr.includes('websocket') ||
            reasonMsg.includes('websocket')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            console.info('Gracefully suppressed unhandled Vite HMR rejection:', event.reason);
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = String(event.message || '');
          const errStr = String(event.error || '');
          if (
            msg.includes('WebSocket') || 
            msg.includes('vite') || 
            msg.includes('websocket') ||
            errStr.includes('WebSocket') ||
            errStr.includes('vite')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            console.info('Gracefully suppressed HMR error:', event.message);
          }
        }, true);
      })();
    </script>
    <!-- Google Fonts for Editorial Swiss Design and Strict Technical Minimalism -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
